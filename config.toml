
# Heading levels are fully independent. Drop any subsection to inherit
# from `[defaults]` (and the active theme).
[headings.h1]
font_size_pt = 22.0
font_weight = "bold"
text_align = "left"
text_color = "#8C1C13"
margin_before_pt = 8.0
margin_after_pt = 4.0

[headings.h2]
font_size_pt = 17.0
font_weight = "bold"
text_color = "#8C1C13"
margin_before_pt = 6.0
margin_after_pt = 3.0

[headings.h3]
font_size_pt = 14.0
font_weight = "bold"
text_color = "#8C1C13"

[headings.h4]
font_size_pt = 12.0
font_weight = "bold"

[headings.h5]
font_size_pt = 11.0
font_weight = "bold"

[headings.h6]
font_size_pt = 10.5
font_weight = "bold"
text_color = "#57606A"


# Fenced code blocks (```).
[code_block]
#font_family = "Courier"
#background_color = "#F6F8FA"
#text_color = "#1F2328"
#padding = { top = 8.0, right = 10.0, bottom = 8.0, left = 10.0 }
#margin_before_pt = 6.0
#margin_after_pt = 6.0
# [code_block.border]
# all = { width_pt = 0.5, color = "#E1E4E8", style = "solid" }


# Inline code spans (`...`).
[code_inline]
font_family = "Courier"
background_color = "#EFF1F3"
text_color = "#1F2328"


# Block quotes (>).
[blockquote]
font_style = "italic"
text_color = "#57606A"
indent_pt = 17.0
padding = { top = 2.0, right = 6.0, bottom = 2.0, left = 8.0 }
margin_before_pt = 4.0
margin_after_pt = 4.0
[blockquote.border]
left = { width_pt = 3.0, color = "#D0D7DE", style = "solid" }


# Lists (ordered / unordered / task).
[list]
[list.common]
margin_after_pt = 0.5
indent_per_level_pt = 17.0
item_spacing_tight_pt = 0.5
item_spacing_loose_pt = 2.0
bullet_gap_pt = 5.67          # gap between the bullet/number and the text

[list.unordered]
bullet = "•"

[list.ordered]
bullet = "1."

[list.task]


[table]
row_gap_pt = 2.0
cell_padding = { top = 3.0, right = 4.0, bottom = 3.0, left = 4.0 }
margin_before_pt = 4.0
margin_after_pt = 4.0
# alternating_row_background = "#FAFBFC"

[table.header]
font_weight = "bold"

[table.cell]

[table.border.all]
width_pt = 0.5
color = "#D0D7DE"
style = "solid"   # solid | dashed | dotted


[image]
max_width_pct = 100.0
align = "center"     # left | center | right
margin_before_pt = 4.0
margin_after_pt = 4.0
# [image.caption]
# font_size_pt = 9.0
# font_style = "italic"
# text_align = "center"


[link]
text_color = "#0969DA"
underline = false


# Inline highlight (==text==).
[mark]
background_color = "#FFF59D"


# LaTeX math ($...$ inline, $$...$$ display). Display blocks honor
# these; inline math always tracks the surrounding text size. Math is
# typeset by the built-in TeX engine and drawn as vector outlines.
[math]
align = "center"        # center | left | right
scale = 1.08            # display size as a multiple of the body size
color = "#1A1A1A"       # defaults to the paragraph text color
margin_before_pt = 6.0
margin_after_pt = 6.0


# Horizontal rules (---).
[horizontal_rule]
color = "#D0D7DE"
thickness_pt = 0.5
style = "solid"     # solid | dashed | dotted
width_pct = 100.0
margin_before_pt = 6.0
margin_after_pt = 6.0


# Document metadata written to the PDF Info dict.
[metadata]
# title = "My Document"
# author = "Author Name"
# subject = "Subject line"
# keywords = ["one", "two"]
creator = "markdown2pdf"
# BCP-47 language tag; emitted as the PDF /Lang catalog entry for
# screen readers. Omitted entirely when unset.
# language = "en-US"


# Headers and footers. Three slots (left / center / right) with
# template variables: {page}, {total_pages}, {title}, {date}, {author}.
# [header]
# left = "{title}"
# right = "{page} / {total_pages}"
# show_on_first_page = false
#
# [footer]
# center = "{page}"


# Title page (renders before the body when `title` is set).
# [title_page]
# title = "Document Title"
# subtitle = "Optional subtitle"
# author = "Author Name"
# date = "2026-05-14"
# cover_image_path = "cover.png"


# Auto-generated table of contents.
# [toc]
# enabled = false
# title = "Contents"
# max_depth = 3


# Operator-only limits on what a document may pull in while rendering.
# The document itself can never set these (frontmatter is metadata
# only), so this block is the one place policy for *untrusted* input
# lives. All three default to permissive, unconfined behavior — set
# `image_root` if you render markdown you did not author yourself.
# [security]
# image_root = "/srv/uploads"        # confine local image reads to this directory
# allow_absolute_image_paths = true  # false to reject absolute local paths outright
# allow_remote_images = true         # false to reject http(s) images